aid: tps-engage
name: TPS Engage
description: >-
  TPS Engage, LLC operates Blindspot (seeblindspot.com), a self-serve
  programmatic digital out-of-home (DOOH) advertising platform: 3,000,000+
  digital billboards and screens in 50+ countries bookable by the exact hour,
  with pay-per-play pricing, no minimums, and an agentic AI media planner
  (Blinky). The company publishes one public API — the Blindspot Pull API, the
  device-facing surface screen owners use to pull the creative to play,
  prefetch media, and log verified proof-of-play — documented with an OpenAPI
  3.0 spec on the TPSEngage GitHub org. Originally added to the API Evangelist
  network as a Techstars portfolio lead, this profile has been enriched from
  Blindspot's public surface.
