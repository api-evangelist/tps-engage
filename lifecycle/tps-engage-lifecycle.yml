summary: >-
  TPS Engage publishes no API lifecycle policy. There is no changelog, no status
  page, no deprecation or sunset policy, no versioning policy and no uptime SLA for
  the Blindspot Pull API. What does exist is a set of commercial-contract commitments
  in the Terms of Service and the Support & Disputes Policy — 15 days' prior notice
  of material adverse changes, incident communication by email and in-product notice,
  and severity-banded support acknowledgement/resolution targets. Those govern the
  platform, not the API contract, and none of them mention API versions or endpoint
  removal. The published OpenAPI has not changed since 2024-10-08.
versioning:
  policy_published: false
  scheme: none
  current_version: '1.0.0'
  in_path: false
  detail: >-
    info.version is 1.0.0. The base URL's {apiPublisher} segment (default `sv`) is a
    publisher identifier, not a version, so a caller has no way to pin a version and
    no way to detect that the contract moved. No Accept-version or X-Version header.
deprecation:
  policy_published: false
