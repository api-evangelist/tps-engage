gaps:
- No changelog, so a screen owner cannot tell when the Pull API last changed.
- No status page, so outage state is only knowable by email if you are already a customer.
- No deprecation/sunset policy and no version pinning — a breaking change would arrive unannounced at the same URL.
- Spec unchanged since 2024-10-08 with no statement of whether that is stability or abandonment.
