  deprecated_operations: []
  detail: >-
    No RFC 8594 Sunset or Deprecation headers were observed on any response, and no
    operation in the published OpenAPI carries `deprecated: true`. No API deprecation
    or endpoint-retirement policy is published anywhere on seeblindspot.com. The
    closest published commitment is a general contract-change clause, recorded under
    change_notice below — it is not an API deprecation policy and is not counted as
    one here.
change_notice:
  published: true
  source: https://seeblindspot.com/terms-of-service/
  window: 15 days
  quote: >-
    "For any material change that adversely affects your rights or obligations, we
    will give at least 15 days' prior notice by email and in-Platform notice."
  detail: >-
    Terms of Service, section 21. Applies to the platform agreement; changes made for
    legal or security reasons may take effect faster. Nothing in the ToS extends this
    to API endpoints, response shapes or the Pull API contract.
changelog:
  published: false
  url: null
  detail: >-
    No /changelog/, /releases/ or release-notes page exists on seeblindspot.com
    (probed 2026-08-13, all 404). The only dated change record for the API is the git
    history of the spec repository, github.com/TPSEngage/BlindspotPullApi, whose last
    commit is 2024-10-08 ("update 5"). The repository is a fork of the
    peter-evans/swagger-github-pages template with the Blindspot spec dropped in; it
    has six commits, all on 2024-10-08. The published contract has therefore been
    static for roughly 22 months.
