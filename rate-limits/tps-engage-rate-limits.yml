summary: >-
  TPS Engage publishes no rate limits for the Blindspot Pull API, and the live API
  returns no rate-limit signalling headers. This is an honest zero, not an unchecked
  field: the hosted Swagger UI, the OpenAPI itself, the Terms of Service and the
  Acceptable Use policy were all read on 2026-08-13 and none states a request quota,
  a polling interval, a burst allowance or a 429 behaviour. Since the API is the
  device-facing polling surface for DOOH players, a published minimum poll interval
  is exactly the guidance an integrator needs and exactly what is missing.
