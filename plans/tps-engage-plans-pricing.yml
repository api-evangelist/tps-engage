summary: >-
  Blindspot publishes no subscription plans, no seat tiers and no API pricing. There
  is exactly one commercial model and it is fully public: consumption billing on a
  single unit — the play — with the price of every individual screen shown on the map
  before booking. That is the finding, and it is deliberate on the provider's part
  rather than an omission: "There is no minimum budget for a digital out-of-home
  campaign on Blindspot: no retainer, no platform fee, no minimum buy-in."
  plan_count is 0 because there are genuinely no tiers to enumerate, not because
  pricing is hidden — Blindspot is one of the very few DOOH platforms that publishes
  a per-play price index rather than gating rates behind a sales call.
